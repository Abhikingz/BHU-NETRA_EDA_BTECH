version: '3.8'

services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: bhu-netra-postgres
    environment:
      POSTGRES_DB: bhunetradb
      POSTGRES_USER: bhunetra
      POSTGRES_PASSWORD: secure_gov_password_2026
    ports:
      - "5432:5432"
    volumes:
      - ./database/init_postgres_postgis.sql:/docker-entrypoint-initdb.d/01_init.sql
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: bhu-netra-redis
    ports:
      - "6379:6379"

  minio-object-store:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: bhu-netra-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mission-planner:
    build:
      context: ./services/mission_planner
    container_name: bhu-netra-mission-planner
    ports:
      - "5001:5001"

  command-enclave:
    build:
      context: ./services/command_security_enclave
    container_name: bhu-netra-command-enclave
    ports:
      - "5002:5002"

  ground-station-gateway:
    build:
      context: ./services/ground_station_gateway
    container_name: bhu-netra-gs-gateway
    ports:
      - "5003:5003"

  data-dissemination-portal:
    build:
      context: ./services/data_dissemination_portal
    container_name: bhu-netra-dissemination-portal
    ports:
      - "5004:5004"

volumes:
  postgres_data:
  minio_data:
